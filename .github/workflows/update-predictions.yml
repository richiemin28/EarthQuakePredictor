name: Update Earthquake Predictions

on:
  schedule:
    - cron: '0 */6 * * *'   # Runs every 6 hours automatically
  push:
    branches: [main]         # Also runs when you push changes
  workflow_dispatch:          # Lets you trigger it manually from GitHub

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements_server.txt

      - name: Generate predictions
        run: python generate.py

      - name: Commit updated predictions
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add predictions/latest_predictions.json
          git diff --staged --quiet || git commit -m "chore: update predictions $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
          git push
