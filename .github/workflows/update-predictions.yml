name: Update Earthquake Predictions

on:
  schedule:
    - cron: '0 */6 * * *'   # Every 6 hours automatically
  push:
    branches: [main]
  workflow_dispatch:          # Manual trigger from GitHub

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements_server.txt

      - name: Generate predictions
        run: python generate.py

      - name: Upload predictions JSON to Hostinger via FTP
        if: ${{ secrets.FTP_SERVER != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:     ${{ secrets.FTP_SERVER }}
          username:   ${{ secrets.FTP_USERNAME }}
          password:   ${{ secrets.FTP_PASSWORD }}
          local-dir:  ./predictions/
          server-dir: /public_html/predictions/
          exclude: |
            **/.git*
            live_log.jsonl
        continue-on-error: true

      - name: Commit updated predictions back to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add predictions/latest_predictions.json
          git diff --staged --quiet || git commit -m "chore: update predictions $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
          git push
